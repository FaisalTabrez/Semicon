model:
  name: naf_sr
  width: 32
  encoder_blocks: [2, 2, 4]
  middle_blocks: 6
  decoder_blocks: [2, 2, 2]
  dropout: 0.0
  statistics_conditioning: true
  conditioning_hidden: 64

data:
  manifest: data/splits/manifest_texture_ood.csv
  dataset_root: data/raw/train
  train_split: train
  val_split: val_ood

training:
  seed: 2026
  device: auto
  amp: true
  deterministic: false
  ema_enabled: true
  ema_decay: 0.999
  d4_augmentation: true
  synthetic_probability: 0.0
  batch_size: 32
  num_workers: 2
  max_steps: 5000
  validation_interval: 250
  log_interval: 50
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_steps: 100
  gradient_clip_norm: 1.0
  charbonnier_epsilon: 0.001

output:
  run_dir: runs/naf_sr_student32
